<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>장기</title>
<style>
  :root {
    --bg: #f3f0e9;
    --panel: #fbfaf6;
    --ink: #2f2b26;
    --muted: #8a8177;
    --border: #ddd5c7;
    --board: #e7d8b6;
    --board-edge: #d9c59c;
    --line: #8c7656;
    --piece: #fbf6ea;
    --cho: #2e6b5a;
    --han: #a8423d;
    --accent: #e08a2a;
    --sel: #3b6ea5;
    --check: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --panel: #252421;
      --ink: #ebe6dc;
      --muted: #9c948a;
      --border: #3a3833;
      --board: #c8b288;
      --board-edge: #b39c70;
      --line: #6e5a3e;
      --piece: #f4ecdb;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 32px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .sub { font-size: 13px; color: var(--muted); margin: 0; }
  .sub .c { color: var(--cho); font-weight: 600; }
  .sub .h { color: var(--han); font-weight: 600; }

  .bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
  .seg {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn:hover, .seg button:hover { filter: brightness(0.97); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .status {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: var(--muted);
    padding: 0 2px 10px;
    min-height: 28px;
  }
  .status strong { color: var(--ink); font-weight: 600; }
  .status .warn { color: var(--check); font-weight: 600; margin-left: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .thinking::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .board-wrap { position: relative; }
  svg#board {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: var(--board);
    box-shadow: 0 1px 0 var(--board-edge), 0 6px 20px rgba(0,0,0,0.08);
    touch-action: manipulation;
    user-select: none;
    cursor: pointer;
  }
  .pc text {
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", "AppleMyungjo", "Songti SC", serif;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .fresh { animation: pop 0.28s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0.2; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(28, 27, 25, 0.38);
    border-radius: 12px;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 30px 22px;
    text-align: center;
    min-width: 240px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .card h2 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0.08em; font-weight: 700; }
  .card p { margin: 0 0 18px; font-size: 16px; }
  .card .actions { justify-content: center; }

  .level { display: inline-flex; align-items: center; gap: 6px; }
  .lv-end { font-size: 12px; color: var(--muted); }
  #levelSeg button { min-width: 38px; padding-left: 0; padding-right: 0; font-variant-numeric: tabular-nums; }
  .lv-desc {
    margin: 0 0 12px; padding: 9px 12px;
    font-size: 13px; line-height: 1.5; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  .lv-desc strong { color: var(--ink); font-weight: 600; margin-right: 4px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 12px 2px 0; }
  .legend span { display: inline-flex; align-items: center; }
  .sw { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; margin-right: 6px; display: inline-block; }

  .setup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  .setup .label { color: var(--ink); font-weight: 600; margin-right: 2px; }
  .setup .side-label { margin-left: 4px; }
  .seg.sm { padding: 2px; border-radius: 8px; }
  .seg.sm button { padding: 5px 10px; font-size: 13px; border-radius: 6px; }
  .fname { margin-left: auto; }

  @media (max-width: 420px) {
    .seg button { padding: 7px 11px; font-size: 13px; }
    .seg.sm button { padding: 5px 9px; }
    #levelSeg button { min-width: 32px; }
    .fname { margin-left: 0; width: 100%; }
    .btn { padding: 8px 11px; font-size: 13px; }
  }

  .pos-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .pos-panel[hidden] { display: none; }
  .pos-title { font-weight: 600; font-size: 14px; margin: 0 0 4px; }
  .pos-hint { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .pos-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pos-status { font-size: 12.5px; color: var(--muted); margin: -2px 0 10px; }
  .pos-sub { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .palette-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .pbtn {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--piece);
    font-weight: 700; font-size: 16px; cursor: pointer;
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    border: 2px solid;
  }
  .pbtn.cho { border-color: var(--cho); color: var(--cho); }
  .pbtn.han { border-color: var(--han); color: var(--han); }
  .pbtn.activeBrush { outline: 3px solid var(--sel); outline-offset: 2px; }
  #eraserBtn.activeBrush { outline: 3px solid var(--sel); outline-offset: 2px; }
  .pos-board-wrap { display: flex; justify-content: center; margin: 10px 0; }
  svg#posBoard {
    width: 100%; max-width: 420px; height: auto;
    border-radius: 10px;
    background: var(--board);
    box-shadow: 0 1px 0 var(--board-edge);
    touch-action: manipulation;
    user-select: none;
    cursor: pointer;
  }
  .pos-foot { display: flex; gap: 8px; margin-top: 10px; }
  .pos-foot .btn { flex: 1; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>장기</h1>
    <p class="sub"><span class="c">나 · 초</span> &nbsp;vs&nbsp; <span class="h">컴퓨터 · 한</span></p>
  </header>

  <div class="bar">
    <div class="level">
      <span class="lv-end">초보</span>
      <div class="seg" id="levelSeg" role="group" aria-label="난이도 (1 초보 ~ 5 전문가)">
        <button data-level="1" aria-label="1단계">1</button>
        <button data-level="2" aria-label="2단계">2</button>
        <button data-level="3" aria-label="3단계">3</button>
        <button data-level="4" aria-label="4단계">4</button>
        <button data-level="5" aria-label="5단계">5</button>
      </div>
      <span class="lv-end">전문가</span>
    </div>
    <div class="actions">
      <button class="btn" id="undoBtn">무르기</button>
      <button class="btn" id="newBtn">새 게임</button>
      <button class="btn" id="posBtn">포지션 설정</button>
    </div>
  </div>

  <p class="lv-desc" id="levelDesc" aria-live="polite"></p>

  <div class="setup">
    <span class="label">상차림</span>
    <span class="side-label">왼쪽</span>
    <div class="seg sm" data-side="l" role="group" aria-label="왼쪽 상차림">
      <button data-v="NE">마상</button><button data-v="EN">상마</button>
    </div>
    <span class="side-label">오른쪽</span>
    <div class="seg sm" data-side="r" role="group" aria-label="오른쪽 상차림">
      <button data-v="NE">마상</button><button data-v="EN">상마</button>
    </div>
    <span class="fname" id="fname"></span>
  </div>

  <div class="status"><div id="status"></div><div id="moves"></div></div>

  <div class="board-wrap">
    <svg id="board" viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg">
      <g id="grid"></g>
      <g id="layer"></g>
    </svg>
    <div class="overlay" id="overlay" hidden>
      <div class="card">
        <h2>Game Over</h2>
        <p id="winnerText"></p>
        <div class="actions">
          <button class="btn" id="undoBtn2">무르기</button>
          <button class="btn primary" id="newBtn2">새 게임</button>
        </div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><i class="sw" style="border-color:var(--accent);background:rgba(224,138,42,.25)"></i>상대의 최근 수</span>
    <span><i class="sw" style="border-color:var(--sel)"></i>선택 / 이동 가능</span>
  </div>

  <div class="pos-panel" id="posPanel" hidden>
    <p class="pos-title">포지션 설정</p>
    <p class="pos-hint">사진으로 자동 인식하거나 아래 팔레트로 말을 직접 배치해서, 원하는 상황부터 바로 시작할 수 있습니다. 자동 인식은 틀릴 수 있으니 시작 전에 꼭 확인하세요.</p>
    <div class="pos-row">
      <button class="btn" id="photoRecognizeBtn">📷 사진으로 인식</button>
      <button class="btn" id="loadStandardPosBtn">표준 배치</button>
      <button class="btn" id="clearPosBtn">전체 지우기</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <p class="pos-status" id="photoStatus" style="display:none;"></p>

    <p class="pos-sub">한(漢) 팔레트</p>
    <div class="palette-row" id="paletteHan"></div>
    <p class="pos-sub">초(楚) 팔레트</p>
    <div class="palette-row" id="paletteCho"></div>
    <button class="btn" id="eraserBtn" style="width:100%;margin-bottom:4px;">🧹 지우개 모드 (탭해서 제거)</button>

    <div class="pos-board-wrap">
      <svg id="posBoard" viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg">
        <g id="posGrid"></g>
        <g id="posLayer"></g>
      </svg>
    </div>

    <p class="pos-sub">내가 둘 진영</p>
    <div class="seg sm" id="posSideSeg" role="group" aria-label="내가 둘 진영">
      <button data-v="1">초 (아래 · 붉은색)</button><button data-v="-1">한 (위 · 파란색)</button>
    </div>
    <p class="pos-sub">시작 차례</p>
    <div class="seg sm" id="posTurnSeg" role="group" aria-label="시작 차례">
      <button data-v="1">초 먼저</button><button data-v="-1">한 먼저</button>
    </div>

    <div class="pos-foot">
      <button class="btn primary" id="startFromPosBtn">▶ 이 포지션으로 시작</button>
      <button class="btn" id="cancelPosBtn">취소</button>
    </div>
  </div>
</main>

<!-- 장기 엔진: 메인 스레드와 Web Worker가 함께 사용 -->
<script id="engine">
var K = 1, R = 2, C = 3, N = 4, E = 5, A = 6, P = 7;
var MATE = 100000, INF = 1e9;
var PV = [0, 0, 130, 70, 50, 30, 30, 20];
var LINES = [[3, 13, 23], [5, 13, 21], [66, 76, 86], [68, 76, 84]];
var DIAG = [];
for (var i0 = 0; i0 < 90; i0++) DIAG.push([]);
LINES.forEach(function (L) { L.forEach(function (q, pos) { DIAG[q].push([L, pos]); }); });
var ORTH = [[-1, 0], [1, 0], [0, -1], [0, 1]];
var LEVELS = {
  1: { depth: 1, noise: 70, q: 1, time: 1500 },
  2: { depth: 2, noise: 35, q: 2, time: 2000 },
  3: { depth: 3, noise: 10, q: 4, time: 3000 },
  4: { depth: 5, noise: 0, q: 5, time: 2500 },
  5: { depth: 12, noise: 0, q: 6, time: 3500 }
};
var ABORT = { abort: true };
var nodes = 0, deadline = 0, killers = null, QMAX = 6;

function onB(r, c) { return r >= 0 && r < 10 && c >= 0 && c < 9; }
function ownPal(side, r, c) { return c >= 3 && c <= 5 && (side > 0 ? r >= 7 && r <= 9 : r >= 0 && r <= 2); }

// 의사 합법 수 생성 (자기 궁이 잡히는지는 검사하지 않음)
function gen(b, side, capOnly) {
  var out = [];
  function add(f, t) {
    var q = b[t];
    if (q && (q > 0) === (side > 0)) return;
    if (capOnly && !q) return;
    out.push((f << 7) | t);
  }
  function enemy(q) { return q && (q > 0) !== (side > 0); }
  for (var i = 0; i < 90; i++) {
    var p = b[i];
    if (!p || (p > 0) !== (side > 0)) continue;
    var t = p > 0 ? p : -p, r = (i / 9) | 0, c = i % 9, d, k, nr, nc, j, q, L, pos;
    switch (t) {
      case K:
      case A:
        for (d = 0; d < 4; d++) {
          nr = r + ORTH[d][0]; nc = c + ORTH[d][1];
          if (ownPal(side, nr, nc)) add(i, nr * 9 + nc);
        }
        for (k = 0; k < DIAG[i].length; k++) {
          L = DIAG[i][k][0]; pos = DIAG[i][k][1];
          if (pos - 1 >= 0) add(i, L[pos - 1]);
          if (pos + 1 <= 2) add(i, L[pos + 1]);
        }
        break;
      case R:
        for (d = 0; d < 4; d++) {
          nr = r + ORTH[d][0]; nc = c + ORTH[d][1];
          while (onB(nr, nc)) {
            j = nr * 9 + nc; q = b[j];
            if (!q) add(i, j); else { if (enemy(q)) add(i, j); break; }
            nr += ORTH[d][0]; nc += ORTH[d][1];
          }
        }
        for (k = 0; k < DIAG[i].length; k++) {
          L = DIAG[i][k][0]; pos = DIAG[i][k][1];
          for (var s = -1; s <= 1; s += 2) {
            var x = pos + s;
            while (x >= 0 && x <= 2) {
              j = L[x]; q = b[j];
              if (!q) add(i, j); else { if (enemy(q)) add(i, j); break; }
              x += s;
            }
          }
        }
        break;
      case C:
        for (d = 0; d < 4; d++) {
          nr = r + ORTH[d][0]; nc = c + ORTH[d][1];
          var jumped = false;
          while (onB(nr, nc)) {
            j = nr * 9 + nc; q = b[j];
            if (!jumped) {
              if (q) { if (q === C || q === -C) break; jumped = true; }
            } else {
              if (!q) add(i, j);
              else { if (enemy(q) && q !== C && q !== -C) add(i, j); break; }
            }
            nr += ORTH[d][0]; nc += ORTH[d][1];
          }
        }
        for (k = 0; k < DIAG[i].length; k++) {
          L = DIAG[i][k][0]; pos = DIAG[i][k][1];
          if (pos === 1) continue;
          var sc = b[L[1]];
          if (sc && sc !== C && sc !== -C) {
            j = L[2 - pos]; q = b[j];
            if (!q || (enemy(q) && q !== C && q !== -C)) add(i, j);
          }
        }
        break;
      case N:
        for (d = 0; d < 4; d++) {
          var dr = ORTH[d][0], dc = ORTH[d][1];
          nr = r + dr; nc = c + dc;
          if (!onB(nr, nc) || b[nr * 9 + nc]) continue;
          for (var s2 = -1; s2 <= 1; s2 += 2) {
            var tr = dr ? r + 2 * dr : r + s2, tc = dr ? c + s2 : c + 2 * dc;
            if (onB(tr, tc)) add(i, tr * 9 + tc);
          }
        }
        break;
      case E:
        for (d = 0; d < 4; d++) {
          var er = ORTH[d][0], ec = ORTH[d][1];
          nr = r + er; nc = c + ec;
          if (!onB(nr, nc) || b[nr * 9 + nc]) continue;
          for (var s3 = -1; s3 <= 1; s3 += 2) {
            var mr = er ? r + 2 * er : r + s3, mc = er ? c + s3 : c + 2 * ec;
            var fr = er ? r + 3 * er : r + 2 * s3, fc = er ? c + 2 * s3 : c + 3 * ec;
            if (!onB(mr, mc) || b[mr * 9 + mc] || !onB(fr, fc)) continue;
            add(i, fr * 9 + fc);
          }
        }
        break;
      case P:
        var f = side > 0 ? -1 : 1;
        if (onB(r + f, c)) add(i, (r + f) * 9 + c);
        if (c > 0) add(i, i - 1);
        if (c < 8) add(i, i + 1);
        for (k = 0; k < DIAG[i].length; k++) {
          L = DIAG[i][k][0]; pos = DIAG[i][k][1];
          for (var s4 = -1; s4 <= 1; s4 += 2) {
            var y = pos + s4;
            if (y >= 0 && y <= 2 && ((L[y] / 9) | 0) === r + f) add(i, L[y]);
          }
        }
        break;
    }
  }
  return out;
}

function findKing(b, side) {
  for (var i = 0; i < 90; i++) if (b[i] === side * K) return i;
  return -1;
}
function inCheck(b, side) {
  var k = findKing(b, side);
  if (k < 0) return true;
  var mv = gen(b, -side, true);
  for (var i = 0; i < mv.length; i++) if ((mv[i] & 127) === k) return true;
  return false;
}
function legalMoves(b, side) {
  var mv = gen(b, side, false), res = [];
  for (var i = 0; i < mv.length; i++) {
    var m = mv[i], f = m >> 7, t = m & 127, cap = b[t];
    b[t] = b[f]; b[f] = 0;
    if (!inCheck(b, side)) res.push(m);
    b[f] = b[t]; b[t] = cap;
  }
  return res;
}
function hasAttackers(b, side) {
  for (var i = 0; i < 90; i++) {
    var p = b[i] * side;
    if (p === R || p === C || p === N || p === E || p === P) return true;
  }
  return false;
}

// 평가 함수 (초 기준, 양수면 초가 유리)
function evaluate(b) {
  var s = 0;
  for (var i = 0; i < 90; i++) {
    var p = b[i];
    if (!p) continue;
    var t = p > 0 ? p : -p, r = (i / 9) | 0, c = i % 9, v = PV[t];
    if (t === P) {
      var adv = p > 0 ? 6 - r : r - 3;
      v += adv * 4 + (c >= 3 && c <= 5 && adv >= 4 ? 6 : 0);
    } else if (t === N || t === C) {
      v += 4 - Math.abs(c - 4);
    } else if (t === R) {
      if (p > 0 ? r <= 6 : r >= 3) v += 5;
    }
    s += p > 0 ? v : -v;
  }
  return s;
}

function orderMoves(b, mv, ply) {
  var n = mv.length, keys = new Array(n), kl = killers ? killers[ply] : 0;
  for (var i = 0; i < n; i++) {
    var m = mv[i], cap = b[m & 127];
    if (cap) {
      var pf = b[m >> 7];
      keys[i] = 1000 + PV[cap > 0 ? cap : -cap] * 10 - PV[pf > 0 ? pf : -pf];
    } else keys[i] = m === kl ? 500 : 0;
  }
  for (var a = 1; a < n; a++) {
    var km = keys[a], mm = mv[a], z = a - 1;
    while (z >= 0 && keys[z] < km) { keys[z + 1] = keys[z]; mv[z + 1] = mv[z]; z--; }
    keys[z + 1] = km; mv[z + 1] = mm;
  }
}

function qsearch(b, alpha, beta, side, ply, qd) {
  if ((++nodes & 2047) === 0 && Date.now() > deadline) throw ABORT;
  var caps = gen(b, side, true), ek = -side * K, i;
  for (i = 0; i < caps.length; i++) if (b[caps[i] & 127] === ek) return MATE - ply;
  var stand = evaluate(b) * side;
  if (stand >= beta || qd >= QMAX) return stand;
  if (stand > alpha) alpha = stand;
  orderMoves(b, caps, 63);
  for (i = 0; i < caps.length; i++) {
    var m = caps[i], f = m >> 7, t = m & 127, cap = b[t];
    b[t] = b[f]; b[f] = 0;
    var sc = -qsearch(b, -beta, -alpha, -side, ply + 1, qd + 1);
    b[f] = b[t]; b[t] = cap;
    if (sc >= beta) return sc;
    if (sc > alpha) alpha = sc;
  }
  return alpha;
}

function negamax(b, depth, alpha, beta, side, ply) {
  if ((++nodes & 2047) === 0 && Date.now() > deadline) throw ABORT;
  if (depth <= 0) return qsearch(b, alpha, beta, side, ply, 0);
  var mv = gen(b, side, false), ek = -side * K, i;
  if (!mv.length) return -MATE + ply;
  for (i = 0; i < mv.length; i++) if (b[mv[i] & 127] === ek) return MATE - ply;
  orderMoves(b, mv, ply);
  var best = -INF;
  for (i = 0; i < mv.length; i++) {
    var m = mv[i], f = m >> 7, t = m & 127, cap = b[t];
    b[t] = b[f]; b[f] = 0;
    var sc = -negamax(b, depth - 1, -beta, -alpha, -side, ply + 1);
    b[f] = b[t]; b[t] = cap;
    if (sc > best) {
      best = sc;
      if (sc > alpha) {
        alpha = sc;
        if (alpha >= beta) { if (!cap && ply < 64) killers[ply] = m; break; }
      }
    }
  }
  return best;
}

// 컴퓨터의 수 결정
function think(board, side, level) {
  var b = Int8Array.from(board);
  var root = legalMoves(b, side);
  if (!root.length) return -1;
  if (root.length === 1) return root[0];
  var cfg = LEVELS[level] || LEVELS[3];
  var start = Date.now();
  QMAX = cfg.q; nodes = 0; deadline = start + cfg.time; killers = new Int32Array(65);
  orderMoves(b, root, 0);
  var i, m, f, t, cap, sc;

  if (cfg.noise) {
    var scores = null;
    for (var d = 1; d <= cfg.depth; d++) {
      try {
        var cur = [];
        for (i = 0; i < root.length; i++) {
          m = root[i]; f = m >> 7; t = m & 127; cap = b[t];
          b[t] = b[f]; b[f] = 0;
          cur.push(-negamax(b, d - 1, -INF, INF, -side, 1));
          b[f] = b[t]; b[t] = cap;
        }
        scores = cur;
      } catch (e) {
        if (e !== ABORT) throw e;
        b.set(board);
        break;
      }
    }
    if (!scores) return root[0];
    var bi = 0, bv = -INF;
    for (i = 0; i < root.length; i++) {
      var v = scores[i] + (Math.random() * 2 - 1) * cfg.noise;
      if (scores[i] > MATE / 2) v += 1e6;
      if (scores[i] < -MATE / 2) v -= 1e6;
      if (v > bv) { bv = v; bi = i; }
    }
    return root[bi];
  }

  var best = root[0];
  for (var depth = 1; depth <= cfg.depth; depth++) {
    try {
      var alpha = -INF, bm = root[0];
      for (i = 0; i < root.length; i++) {
        m = root[i]; f = m >> 7; t = m & 127; cap = b[t];
        b[t] = b[f]; b[f] = 0;
        sc = -negamax(b, depth - 1, -INF, -alpha, -side, 1);
        b[f] = b[t]; b[t] = cap;
        if (sc > alpha) { alpha = sc; bm = m; }
      }
      best = bm;
      root.splice(root.indexOf(bm), 1);
      root.unshift(bm);
      if (alpha > MATE / 2) break;
      if (Date.now() - start > cfg.time * 0.45) break;
    } catch (e) {
      if (e !== ABORT) throw e;
      b.set(board);
      break;
    }
  }
  return best;
}

<script>

  /* ============================================================

  var edUserSide = 1;
  var edStartTurn = 1;
  var edBrush = null;        // 부호*기물 정수 값, 또는 null/'erase' (지우개)
  var edBrushBtn = null;

  // 에디터용 보드 격자 (한 번만 그림)
  (function drawPosGrid() {
    var g = '';
    var col = 'var(--line)';
    g += '<rect x="' + (M - 14) + '" y="' + (M - 14) + '" width="' + (8 * S + 28) + '" height="' + (9 * S + 28) + '" fill="none" stroke="' + col + '" stroke-opacity=".35" stroke-width="1" rx="4"/>';
    for (var r = 0; r < 10; r++) g += '<line x1="' + X(0) + '" y1="' + Y(r) + '" x2="' + X(8) + '" y2="' + Y(r) + '" stroke="' + col + '" stroke-width="1.2"/>';
    for (var c = 0; c < 9; c++) g += '<line x1="' + X(c) + '" y1="' + Y(0) + '" x2="' + X(c) + '" y2="' + Y(9) + '" stroke="' + col + '" stroke-width="1.2"/>';
    g += '<rect x="' + X(0) + '" y="' + Y(0) + '" width="' + 8 * S + '" height="' + 9 * S + '" fill="none" stroke="' + col + '" stroke-width="2.4"/>';
    [[3, 0, 5, 2], [5, 0, 3, 2], [3, 7, 5, 9], [5, 7, 3, 9]].forEach(function (d) {
      g += '<line x1="' + X(d[0]) + '" y1="' + Y(d[1]) + '" x2="' + X(d[2]) + '" y2="' + Y(d[3]) + '" stroke="' + col + '" stroke-width="1.2"/>';
    });
    document.getElementById('posGrid').innerHTML = g;
  })();

  function emptyPosBoard() { return new Array(90).fill(0); }

  function renderPosBoard() {
    var h = '';
    for (var i = 0; i < 90; i++) {
      var p = edBoard[i];
      if (!p) continue;
      var t = Math.abs(p), side = p > 0 ? 1 : -1, x = X(i % 9), y = Y((i / 9) | 0), rad = radius(t), color = sideColorVar(side);
      h += '<g class="pc">';
      h += '<polygon points="' + octagon(x, y, rad) + '" fill="var(--piece)" stroke="' + color + '" stroke-width="2"/>';
      h += '<text x="' + x + '" y="' + (y + 1) + '" font-size="' + (rad * 1.05).toFixed(1) + '" fill="' + color + '">' + CH[side][t] + '</text>';
      h += '</g>';
    }
    posLayer.innerHTML = h;
  }

  function buildPalette() {
    var hanWrap = document.getElementById('paletteHan'), choWrap = document.getElementById('paletteCho');
    hanWrap.innerHTML = ''; choWrap.innerHTML = '';
    var types = [K, A, R, C, N, E, P];
    types.forEach(function (t) {
      var hb = document.createElement('button');
      hb.className = 'pbtn han';
      hb.textContent = CH[-1][t];
      hb.addEventListener('click', function () { setBrush(-t, hb); });
      hanWrap.appendChild(hb);

      var cb = document.createElement('button');
      cb.className = 'pbtn cho';
      cb.textContent = CH[1][t];
      cb.addEventListener('click', function () { setBrush(t, cb); });
      choWrap.appendChild(cb);
    });
  }
  function setBrush(v, btnEl) {
    edBrush = v;
    if (edBrushBtn) edBrushBtn.classList.remove('activeBrush');
    btnEl.classList.add('activeBrush');
    edBrushBtn = btnEl;
    document.getElementById('eraserBtn').classList.remove('activeBrush');
  }
  document.getElementById('eraserBtn').addEventListener('click', function (e) {
    edBrush = 'erase';
    if (edBrushBtn) edBrushBtn.classList.remove('activeBrush');
    edBrushBtn = null;
    e.currentTarget.classList.add('activeBrush');
  });

  posSvg.addEventListener('click', function (e) {
    var idx = pointToIndex(posSvg, e);
    if (idx < 0) return;
    edBoard[idx] = (edBrush === null || edBrush === 'erase') ? 0 : edBrush;
    renderPosBoard();
  });

  function updatePosSideButtons() {
    document.querySelectorAll('#posSideSeg button').forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(+btn.dataset.v === edUserSide));
    });
  }
  function updatePosTurnButtons() {
    document.querySelectorAll('#posTurnSeg button').forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(+btn.dataset.v === edStartTurn));
    });
  }
  document.querySelectorAll('#posSideSeg button').forEach(function (btn) {
    btn.addEventListener('click', function () { edUserSide = +btn.dataset.v; updatePosSideButtons(); });
  });
  document.querySelectorAll('#posTurnSeg button').forEach(function (btn) {
    btn.addEventListener('click', function () { edStartTurn = +btn.dataset.v; updatePosTurnButtons(); });
  });

  document.getElementById('loadStandardPosBtn').addEventListener('click', function () {
    var tmpSetup = { l: 'EN', r: 'EN' };
    var l = pair(tmpSetup.l), r = pair(tmpSetup.r);
    var back = [R, l[0], l[1], A, 0, A, r[0], r[1], R];
    edBoard = emptyPosBoard();
    for (var c = 0; c < 9; c++) { edBoard[c] = -back[c]; edBoard[81 + c] = back[c]; }
    edBoard[13] = -K; edBoard[76] = K;
    edBoard[19] = edBoard[25] = -C; edBoard[64] = edBoard[70] = C;
    [0, 2, 4, 6, 8].forEach(function (c) { edBoard[27 + c] = -P; edBoard[54 + c] = P; });
    renderPosBoard();
  });
  document.getElementById('clearPosBtn').addEventListener('click', function () {
    edBoard = emptyPosBoard();
    renderPosBoard();
  });

  function openPositionPanel() {
    edBoard = emptyPosBoard();
    edUserSide = 1;
    edStartTurn = 1;
    edBrush = null;
    edBrushBtn = null;
    document.getElementById('eraserBtn').classList.remove('activeBrush');
    buildPalette();
    renderPosBoard();
    updatePosSideButtons();
    updatePosTurnButtons();
    photoStatus.style.display = 'none';
    posPanel.hidden = false;
    if (typeof posPanel.scrollIntoView === 'function') {
      posPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  document.getElementById('posBtn').addEventListener('click', openPositionPanel);
  document.getElementById('cancelPosBtn').addEventListener('click', function () { posPanel.hidden = true; });

  document.getElementById('startFromPosBtn').addEventListener('click', function () {
    var hasHanKing = edBoard.indexOf(-K) >= 0, hasChoKing = edBoard.indexOf(K) >= 0;
    if (!hasHanKing || !hasChoKing) {
      photoStatus.textContent = '양쪽 궁(초의 楚, 한의 漢)이 모두 있어야 시작할 수 있어요.';
      photoStatus.style.display = 'block';
      return;
    }
    cancelAI();
    userSide = edUserSide;
    board = Int8Array.from(edBoard);
    history = [];
    turn = edStartTurn;
    gameOver = false; winner = null; selected = null; lastAI = null; checkUser = false;
    updateSubtitle();
    posPanel.hidden = true;
    if (turn === userSide) {
      userMoves = legalMoves(board, userSide);
      checkUser = inCheck(board, userSide);
      render();
    } else {
      userMoves = null;
      render();
      requestAI();
    }
  });

  /* ---------- 사진으로 포지션 자동 인식 (sample 기능 사용 가능할 때만) ---------- */
  var sampleAPI = null, sampleImageLimits = null;
  (async function () {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        sampleAPI = await window.claude.use('sample');
        if (sampleAPI) { try { sampleImageLimits = await sampleAPI.limits(); } catch (e) { sampleImageLimits = null; } }
      }
    } catch (e) { sampleAPI = null; }
  })();

  var TYPE_BY_HANGUL = { '궁': K, '사': A, '차': R, '포': C, '마': N, '상': E, '졸': P, '병': P };

  function buildRecognitionPrompt() {
    return [
      '첨부된 사진은 한국 장기(Janggi) 보드의 현재 상황입니다.',
      '보드를 세로 10줄(row 0~9, row 0이 가장 위쪽 "한(漢)" 진영, row 9가 가장 아래쪽 "초(楚)" 진영), 가로 9칸(col 0~8, 왼쪽부터)의 교차점 좌표계로 인식해 주세요.',
      '각 말의 종류는 다음 한글 한 글자 중 하나로 표기합니다: 궁, 사, 차, 포, 마, 상, 졸(한 진영의 병사), 병(초 진영의 병사).',
      '각 말의 소속(side)은 "han"(한, 보통 위쪽·파란색/검정 계열 글자) 또는 "cho"(초, 보통 아래쪽·빨간색 계열 글자) 중 하나로 표기합니다.',
      '사진에 "나의 차례" 또는 "상대 차례" 같은 차례 표시가 보이면, 그것이 한과 초 중 어느 쪽 차례인지 유추해서 turn 필드에 넣어 주세요. 확실하지 않으면 "unknown"으로 표기하세요.',
      '보이는 말만 포함하고, 다음 JSON 형식으로만 답하세요. 다른 설명은 절대 넣지 마세요:',
      '{"pieces": [{"row": 0, "col": 4, "type": "궁", "side": "han"}], "turn": "han"}'
    ].join('\n');
  }

  function applyRecognizedBoard(data) {
    if (!data || !Array.isArray(data.pieces)) throw new Error('bad shape');
    var nb = emptyPosBoard();
    for (var i = 0; i < data.pieces.length; i++) {
      var p = data.pieces[i];
      var r = Number(p && p.row), c = Number(p && p.col);
      if (!(r >= 0 && r <= 9 && c >= 0 && c <= 8)) continue;
      var side = (p && p.side === 'han') ? -1 : (p && p.side === 'cho') ? 1 : null;
      if (!side) continue;
      var t = TYPE_BY_HANGUL[p && p.type];
      if (!t) continue;
      nb[r * 9 + c] = t * side;
    }
    edBoard = nb;
    renderPosBoard();
    if (data.turn === 'han') { edStartTurn = -1; updatePosTurnButtons(); }
    else if (data.turn === 'cho') { edStartTurn = 1; updatePosTurnButtons(); }
  }

  document.getElementById('photoRecognizeBtn').addEventListener('click', function () {
    if (!sampleAPI || !sampleImageLimits || !sampleImageLimits.images) {
      photoStatus.textContent = '이 환경에서는 사진 자동 인식을 사용할 수 없어요. 위 팔레트로 직접 배치해 주세요.';
      photoStatus.style.display = 'block';
      return;
    }
    document.getElementById('photoInput').click();
  });

  document.getElementById('photoInput').addEventListener('change', async function (ev) {
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file || !sampleAPI) return;
    photoStatus.style.display = 'block';
    photoStatus.textContent = '사진에서 장기판을 인식하는 중... (최대 1분 정도 걸릴 수 있어요)';
    try {
      var data = await sampleAPI.json(buildRecognitionPrompt(), { images: file, modelTier: 'default', cache: false });
      applyRecognizedBoard(data);
      photoStatus.textContent = '인식 완료! 틀리게 인식된 말이 있으면 팔레트로 직접 고쳐 주세요.';
    } catch (e) {
      var code = (e && e.code) ? e.code : 'error';
      photoStatus.textContent = '인식에 실패했습니다 (' + code + '). 팔레트로 직접 배치해 주세요.';
    }
  });

  worker = makeWorker();
  newGame();
})();
</script>
</body>
</html>
